plugins {
    id 'com.android.application'
}

android {
    namespace 'ro.officeparking.widget'
    compileSdk 35

    defaultConfig {
        applicationId 'ro.officeparking.widget'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.work:work-runtime:2.9.1'
}

